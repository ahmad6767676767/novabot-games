<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Arcade</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #00ffff;
            font-family: 'Comic Sans MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff007f;
            text-shadow: 2px 2px 5px #ff007f;
            font-size: 40px;
        }

        .game-container {
            background-color: #16213e;
            border: 4px solid #0f3460;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0px 0px 20px #00ffff;
        }

        /* Tic-Tac-Toe Styles */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #0f3460;
            color: #e94560;
            font-size: 50px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
        }

        .cell:hover {
            background-color: #e94560;
            color: #0f3460;
        }

        /* Rock Paper Scissors Styles */
        .rps-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 10px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0px 0px 10px #ff007f;
        }

        .rps-btn:hover {
            background-color: white;
            color: #ff007f;
        }

        .status {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
        }
        
        button.reset {
            background-color: #00ffff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎮 My Awesome Arcade 🎮</h1>

    <!-- TIC-TAC-TOE GAME -->
    <div class="game-container">
        <h2>❌ Tic-Tac-Toe ⭕</h2>
        <div class="status" id="ttt-status">Player X's Turn</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <button class="reset" onclick="resetTicTacToe()">Restart Game</button>
    </div>

    <!-- ROCK PAPER SCISSORS GAME -->
    <div class="game-container">
        <h2>🪨📄✂️ Rock Paper Scissors</h2>
        <p>Play against the computer!</p>
        <button class="rps-btn" onclick="playRPS('Rock')">Rock 🪨</button>
        <button class="rps-btn" onclick="playRPS('Paper')">Paper 📄</button>
        <button class="rps-btn" onclick="playRPS('Scissors')">Scissors ✂️</button>
        <div class="status" id="rps-status">Waiting for your move...</div>
    </div>

    <script>
        // --- TIC TAC TOE LOGIC ---
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let tttActive = true;

        function makeMove(index) {
            if (board[index] !== "" || !tttActive) return;

            board[index] = currentPlayer;
            document.getElementsByClassName("cell")[index].innerText = currentPlayer;

            if (checkWin()) {
                document.getElementById("ttt-status").innerText = currentPlayer + " WINS! 🎉";
                tttActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("ttt-status").innerText = "It's a Draw! 🤝";
                tttActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById("ttt-status").innerText = "Player " + currentPlayer + "'s Turn";
        }

        function checkWin() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6]             // Diagonals
            ];
            for (let pattern of winPatterns) {
                if (board[pattern[0]] && board[pattern[0]] === board[pattern[1]] && board[pattern[0]] === board[pattern[2]]) {
                    return true;
                }
            }
            return false;
        }

        function resetTicTacToe() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            tttActive = true;
            document.getElementById("ttt-status").innerText = "Player X's Turn";
            let cells = document.getElementsByClassName("cell");
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = "";
            }
        }

        // --- ROCK PAPER SCISSORS LOGIC ---
        function playRPS(userChoice) {
            const choices = ["Rock", "Paper", "Scissors"];
            const computerChoice = choices[Math.floor(Math.random() * 3)];
            let result = "";

            if (userChoice === computerChoice) {
                result = "It's a Tie! 😐";
            } else if (
                (userChoice === "Rock" && computerChoice === "Scissors") ||
                (userChoice === "Paper" && computerChoice === "Rock") ||
                (userChoice === "Scissors" && computerChoice === "Paper")
            ) {
                result = "You Win! 🏆";
            } else {
                result = "Computer Wins! 😭";
            }

            document.getElementById("rps-status").innerHTML = 
                "You: " + userChoice + " <br> Computer: " + computerChoice + " <br><br> <strong>" + result + "</strong>";
        }
    </script>
</body>
</html>
